<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alfonso Crego Calvo · Backend & Ciberseguridad</title>
    <meta
      name="description"
      content="Portfolio de Alfonso Crego Calvo, estudiante de 4º de Ingeniería Informática en la Universidad de Salamanca, enfocado en desarrollo backend y ciberseguridad."
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0d1013" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica el tema guardado antes de que React monte, para evitar parpadeo -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
